name: Desktop Build (Windows)

# Construye el instalador de escritorio para PC (Windows / NSIS) con electron-builder
# en un runner de Windows con acceso completo a la red. Genera el .exe como artefacto
# y publica el Release v1.5.0 (Modo Restaurante).

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - build/restaurant-installer
      - claude/reset-fix-v1.5.0

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle + Windows installer
        run: npm run electron:build
        env:
          # Credenciales públicas (anon) reales del proyecto POS, embebidas al
          # compilar — igual que en android-apk.yml. Sin esto el instalador
          # apuntaba a placeholder.supabase.co y toda petición fallaba con
          # "Failed to fetch". Si defines los secrets del repo, tienen prioridad.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://ypbajygoqqgaurikuctd.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwYmFqeWdvcXFnYXVyaWt1Y3RkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc4ODkxMDYsImV4cCI6MjA4MzQ2NTEwNn0.YgpUm8tE6rgcvdUG85-7H8nXWNt6oYMZq-4G6LBELRk' }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-pos-windows-installer
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (v1.5.0 - Modo Restaurante)
        # Solo publica el Release oficial desde un tag v* (no desde ramas de
        # trabajo como claude/reset-fix-v1.5.0, que solo generan el artefacto).
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.0
          name: Nexus POS v1.5.0 — Modo Restaurante
          target_commitish: ${{ github.sha }}
          body: |
            Instalador de escritorio para Windows (NSIS) de Nexus POS v1.5.0.
            Incluye el Modo Restaurante (mesas, KDS, modificadores, dividir cuenta, recetas).
            Descarga `Bisne con Talla Setup 1.5.0.exe` más abajo.
          files: |
            release/*.exe
            release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
