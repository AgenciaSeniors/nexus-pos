name: Desktop Build (Windows)

# Construye el instalador de escritorio para PC (Windows / NSIS) con electron-builder
# en un runner de Windows con acceso completo a la red. Genera el .exe como artefacto
# y publica el Release v1.5.0 (Modo Restaurante).

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - build/restaurant-installer
      - claude/reset-fix-v1.5.0

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle + Windows installer
        # `-p never`: electron-builder SOLO compila, no publica. Con GH_TOKEN
        # presente publicaba por su cuenta un release en borrador, y el paso
        # "Publish GitHub Release" de mas abajo subia el MISMO instalador otra
        # vez con distinto nombre: el release quedaba con dos .exe de 104MB
        # (uno con guiones, otro con puntos) y un latest.yml inservible, porque
        # el proyecto no usa electron-updater. Un solo publicador: el de abajo.
        run: npm run electron:build -- -p never
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder' }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-pos-windows-installer
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        # Solo publica el Release oficial desde un tag v* (no desde ramas de
        # trabajo, que solo generan el artefacto).
        #
        # tag_name SIGUE AL TAG QUE DISPARO EL WORKFLOW. Estaba fijo en v1.5.0,
        # asi que empujar v1.6.0 subio su instalador DENTRO del release v1.5.0:
        # el release viejo quedaba con los dos .exe y el nuevo sin publicar.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Nexus POS ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          body: |
            Instalador de escritorio para Windows (NSIS) de Nexus POS ${{ github.ref_name }}.

            Descarga el `.exe` de abajo y ejecutalo. Las notas de esta version
            estan en el CHANGELOG del repositorio.
          files: |
            release/*.exe
            release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
