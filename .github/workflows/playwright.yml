name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
      env:
        # Variables públicas anon — necesarias para que Vite arranque el dev
        # server sin fallar. Placeholder si no hay secrets configurados.
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder' }}
        # Credenciales del suite de integración (stress_extreme). Si no están
        # definidas, ese suite se omite automáticamente y el resto corre igual.
        ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
        ADMIN_PASS: ${{ secrets.E2E_ADMIN_PASS }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
