name: Android APK

# Compila un APK de Android (debug, instalable sin keystore) en la nube y lo
# deja descargable como artefacto del run y como un prerelease "android-latest"
# con enlace directo .apk para instalar desde el teléfono.
#
# Antes de ejecutarlo, añade en el repo (Settings → Secrets and variables →
# Actions) los secrets VITE_SUPABASE_URL y VITE_SUPABASE_ANON_KEY. Si faltan,
# el APK abrirá la pantalla de configuración en vez de conectarse a Supabase.

on:
  # Genera el APK descargable en cada cambio de main. Las ramas de trabajo
  # que habia aqui ya no existen; para compilar desde una rama esta
  # workflow_dispatch, que no exige tocar este archivo.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # necesario para publicar/actualizar el release con el APK

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22' # Capacitor CLI requiere Node >= 22
          cache: 'npm'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21' # capacitor-android compila con source release 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Por defecto la accion instala el paquete 'tools', que Google retiro
          # del repositorio del SDK: sdkmanager responde "Failed to find package
          # 'tools'" y el job muere antes de compilar nada. El paso siguiente ya
          # instala explicitamente lo que hace falta, asi que no se pide ninguno.
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build
        env:
          # Credenciales públicas (anon) de Supabase, embebidas al compilar.
          # Son públicas por diseño (protegidas por RLS) y ya viajan dentro del
          # APK/web. Si defines los secrets del repo, estos tienen prioridad.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://ypbajygoqqgaurikuctd.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwYmFqeWdvcXFnYXVyaWt1Y3RkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc4ODkxMDYsImV4cCI6MjA4MzQ2NTEwNn0.YgpUm8tE6rgcvdUG85-7H8nXWNt6oYMZq-4G6LBELRk' }}

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk bisne-con-talla-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: bisne-con-talla-debug-apk
          path: bisne-con-talla-debug.apk
          if-no-files-found: error

      - name: Publish to "android-latest" prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: APK Android (última build)
          prerelease: true
          body: |
            APK de depuración de **Bisne con Talla** para instalar en dispositivos propios
            (Android 7.0+). Descarga `bisne-con-talla-debug.apk`, ábrelo en el teléfono y
            permite "instalar apps de orígenes desconocidos".

            Generado automáticamente desde el workflow *Android APK*.
          files: bisne-con-talla-debug.apk
