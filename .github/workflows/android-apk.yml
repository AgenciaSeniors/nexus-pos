name: Android APK

# Compila un APK de Android (debug, instalable sin keystore) en la nube y lo
# deja descargable como artefacto del run y como un prerelease "android-latest"
# con enlace directo .apk para instalar desde el teléfono.
#
# Antes de ejecutarlo, añade en el repo (Settings → Secrets and variables →
# Actions) los secrets VITE_SUPABASE_URL y VITE_SUPABASE_ANON_KEY. Si faltan,
# el APK abrirá la pantalla de configuración en vez de conectarse a Supabase.

on:
  # Genera el APK descargable en cada cambio de main. Las ramas de trabajo
  # que habia aqui ya no existen; para compilar desde una rama esta
  # workflow_dispatch, que no exige tocar este archivo.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # necesario para publicar/actualizar el release con el APK

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22' # Capacitor CLI requiere Node >= 22
          cache: 'npm'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21' # capacitor-android compila con source release 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Por defecto la accion instala el paquete 'tools', que Google retiro
          # del repositorio del SDK: sdkmanager responde "Failed to find package
          # 'tools'" y el job muere antes de compilar nada. El paso siguiente ya
          # instala explicitamente lo que hace falta, asi que no se pide ninguno.
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build
        env:
          # Credenciales públicas (anon) de Supabase, embebidas al compilar.
          # Son públicas por diseño (protegidas por RLS) y ya viajan dentro del
          # APK/web. Si defines los secrets del repo, estos tienen prioridad.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://ypbajygoqqgaurikuctd.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwYmFqeWdvcXFnYXVyaWt1Y3RkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc4ODkxMDYsImV4cCI6MjA4MzQ2NTEwNn0.YgpUm8tE6rgcvdUG85-7H8nXWNt6oYMZq-4G6LBELRk' }}

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      # ── FIRMA ────────────────────────────────────────────────────────────
      # assembleDebug firma con el keystore de depuracion, que cada runner de
      # GitHub genera NUEVO. Eso cambia la firma en cada build y Android
      # rechaza instalar encima ("Aplicacion no instalada"): el usuario tiene
      # que desinstalar, y ahi pierde todo lo que no estuviera sincronizado.
      #
      # Con los secrets puestos se compila un APK de release firmado SIEMPRE
      # con la misma clave, y actualizar encima funciona. Sin ellos se sigue
      # generando el de depuracion, para no romper el build de quien no los
      # tenga configurados.
      - name: ¿Hay keystore configurado?
        id: keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "hay=true" >> "$GITHUB_OUTPUT"
          else
            echo "hay=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Sin ANDROID_KEYSTORE_BASE64: se compila un APK de depuracion y NO se podra instalar encima de una version anterior."
          fi

      - name: Restaurar keystore
        if: steps.keystore.outputs.hay == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build APK firmado (release)
        if: steps.keystore.outputs.hay == 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon             -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/release.keystore"             -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"             -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}"             -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"
        working-directory: android

      - name: Build APK de depuracion (sin keystore)
        if: steps.keystore.outputs.hay != 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
        working-directory: android

      # El nombre NO dice "debug": con el keystore configurado el APK es de
      # release firmado, y un archivo llamado "-debug" hace dudar a quien lo
      # recibe de si es la version buena. Neutro sirve para los dos caminos.
      - name: Rename APK
        run: |
          if [ "${{ steps.keystore.outputs.hay }}" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk bisne-con-talla.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk bisne-con-talla.apk
          fi

      - name: Borrar el keystore del runner
        if: always()
        run: rm -f android/app/release.keystore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: bisne-con-talla-apk
          path: bisne-con-talla.apk
          if-no-files-found: error

      - name: Publish to "android-latest" prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: APK Android (última build)
          prerelease: true
          body: |
            APK de **Bisne con Talla** para Android 7.0+. Descarga `bisne-con-talla.apk`,
            ábrelo en el teléfono y permite "instalar apps de orígenes desconocidos".

            **Actualizar:** instala encima, sin desinstalar. Antes de hacerlo, abre la app
            con internet y espera a que termine de sincronizar.

            Generado automáticamente desde el workflow *Android APK* en cada cambio de `main`.
          files: bisne-con-talla.apk
