apply plugin: 'com.android.application'

// Lee versión desde package.json para mantener todo sincronizado
def packageJson = new groovy.json.JsonSlurper().parseText(file('../../package.json').text)
def appVersion = packageJson.version ?: "1.0.0"
def parts = appVersion.tokenize('.')
// versionCode: 1.2.3 → 10203  (máx 99 por segmento)
def computedVersionCode = parts[0].toInteger() * 10000 + parts[1].toInteger() * 100 + (parts.size() > 2 ? parts[2].toInteger() : 0)

android {
    namespace "com.bisne.contalla"
    compileSdkVersion rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.bisne.contalla"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode computedVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // ESTO TAMBIÉN FALTABA: Forzar Java 17 en la app
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // La clave de firma NO vive en el repositorio. Dos caminos:
    //  - CI: el workflow pasa -Pandroid.injected.signing.* desde los secrets de
    //    GitHub, que Gradle aplica sobre el build de release.
    //  - Local: define las cuatro BISNE_* en android/local.properties (ignorado
    //    por git) apuntando a un keystore fuera del repo.
    // Sin ninguno de los dos, assembleRelease produce un APK SIN FIRMAR.
    def signingProps = new Properties()
    def localPropsFile = rootProject.file('local.properties')
    if (localPropsFile.exists()) localPropsFile.withInputStream { signingProps.load(it) }
    def hasLocalSigning = ['BISNE_STORE_FILE', 'BISNE_STORE_PASSWORD', 'BISNE_KEY_ALIAS', 'BISNE_KEY_PASSWORD']
            .every { signingProps[it] }

    signingConfigs {
        if (hasLocalSigning) {
            release {
                storeFile file(signingProps['BISNE_STORE_FILE'])
                storePassword signingProps['BISNE_STORE_PASSWORD']
                keyAlias signingProps['BISNE_KEY_ALIAS']
                keyPassword signingProps['BISNE_KEY_PASSWORD']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasLocalSigning) signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}